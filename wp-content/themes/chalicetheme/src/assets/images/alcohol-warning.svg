<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 110" width="100%" height="auto">
  <defs>
    <!-- Text Gradient with CSS Custom Properties -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="var(--warning-red, #C62828)" />
      <stop offset="50%" stop-color="var(--warning-red-mid, #8E0000)" />
      <stop offset="100%" stop-color="var(--warning-red-dark, #4A0000)" />
    </linearGradient>
  </defs>

  <!-- Icon Group -->
  <g transform="translate(25, 15)">
    <!-- Prohibition Red Ring & Slash -->
    <circle cx="40" cy="40" r="35" stroke="var(--warning-red, #B71C1C)" stroke-width="7" fill="none" />
    <line x1="16" y1="16" x2="64" y2="64" stroke="var(--warning-red, #B71C1C)" stroke-width="7" />

    <!-- Wine Glass -->
    <path d="M 42 22 L 60 22 L 58 38 C 56 46 48 48 42 48 C 36 48 28 46 26 38 L 24 22 Z" fill="var(--icon-color, #212121)" />
    <path d="M 42 48 L 42 62 M 34 62 L 50 62" stroke="var(--icon-color, #212121)" stroke-width="4" stroke-linecap="round" />

    <!-- Scooter & Car Silhouette Icons -->
    <path d="M 18 52 C 18 46 24 44 28 44 C 30 44 32 46 32 50 L 16 50 Z" fill="var(--icon-color, #212121)" />
    <circle cx="20" cy="54" r="3" fill="var(--icon-color, #212121)" />
    <circle cx="28" cy="54" r="3" fill="var(--icon-color, #212121)" />
  </g>

  <!-- Legal Text -->
  <text x="120" y="72" fill="url(#textGradient)" font-family="&#39;Noto Serif TC&#39;, &#39;Songti TC&#39;, serif" font-size="46" font-weight="900" letter-spacing="8">
    酒後不開車  安全有保障
  </text>
</svg>